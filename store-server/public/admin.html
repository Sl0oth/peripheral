<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin — Peripheral Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav>
  <span class="logo">◈ Peripheral Store — Admin</span>
  <a href="/">← Store</a>
</nav>

<div class="container">

  <!-- Login -->
  <div id="login-panel">
    <h1>Admin Login</h1>
    <div class="form-group" style="max-width:360px;margin-top:24px">
      <label>Admin Token</label>
      <input type="password" id="token-input" placeholder="Enter admin token..." onkeydown="if(event.key==='Enter')login()">
    </div>
    <button onclick="login()">Login</button>
    <div id="login-error" style="color:var(--danger);font-size:0.85em;margin-top:10px;display:none">
      Invalid token.
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h1>Script Review</h1>
      <button onclick="logout()" style="font-size:0.8em;opacity:0.6">Logout</button>
    </div>

    <div class="tab-row">
      <button id="tab-pending"  class="active"   onclick="setTab('pending')">Pending</button>
      <button id="tab-approved"                  onclick="setTab('approved')">Approved</button>
      <button id="tab-rejected"                  onclick="setTab('rejected')">Rejected</button>
    </div>

    <div id="admin-list"><div class="empty">Loading...</div></div>
  </div>

  <!-- Detail modal -->
  <div id="modal-bg" style="display:none;position:fixed;inset:0;background:#000a;z-index:100;overflow-y:auto;padding:20px">
    <div style="max-width:800px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
        <div>
          <h2 id="modal-name"></h2>
          <div id="modal-meta" style="color:var(--muted);font-size:0.82em;margin-top:4px"></div>
        </div>
        <button onclick="closeModal()" style="font-size:1.2em;padding:2px 10px">×</button>
      </div>

      <div style="font-size:0.88em;color:var(--text);margin-bottom:12px;line-height:1.6" id="modal-desc"></div>

      <pre id="modal-code" style="max-height:400px"></pre>

      <div id="modal-actions" style="display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap">
        <button class="approve" onclick="approve()">✓ Approve</button>
        <button class="danger"  onclick="showReject()">✗ Reject</button>
        <div id="reject-row" style="display:none;display:flex;gap:8px;flex:1;min-width:200px">
          <input type="text" id="reject-note" placeholder="Reason (optional)" style="flex:1">
          <button class="danger" onclick="reject()">Confirm Reject</button>
        </div>
        <span id="action-msg" style="color:var(--accent);font-size:0.85em"></span>
      </div>

      <div id="modal-status-row" style="margin-top:12px;font-size:0.82em;color:var(--muted)"></div>
    </div>
  </div>

</div>

<script>
let token    = localStorage.getItem('admin_token') || '';
let curTab   = 'pending';
let curId    = null;

function login() {
  token = document.getElementById('token-input').value.trim();
  if (!token) return;
  loadTab('pending').then(ok => {
    if (ok) {
      localStorage.setItem('admin_token', token);
      document.getElementById('login-panel').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
    } else {
      document.getElementById('login-error').style.display = 'block';
      token = '';
    }
  });
}

function logout() {
  localStorage.removeItem('admin_token');
  token = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-panel').style.display = 'block';
}

function setTab(t) {
  curTab = t;
  ['pending','approved','rejected'].forEach(s => {
    document.getElementById('tab-' + s).classList.toggle('active', s === t);
  });
  loadTab(t);
}

async function loadTab(status) {
  const el = document.getElementById('admin-list');
  if (el) el.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const res = await fetch('/api/admin/scripts?status=' + status, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (res.status === 401) return false;
    const scripts = await res.json();
    renderList(scripts, status);
    return true;
  } catch (e) {
    if (el) el.innerHTML = '<div class="empty">Error loading scripts.</div>';
    return false;
  }
}

function renderList(scripts, status) {
  const el = document.getElementById('admin-list');
  if (!scripts.length) {
    el.innerHTML = '<div class="empty">No ' + status + ' scripts.</div>';
    return;
  }
  el.innerHTML = scripts.map(s => `
    <div class="card" style="cursor:pointer" onclick="openModal('${s.id}')">
      <div class="card-header">
        <div>
          <div class="card-title">${esc(s.name)}</div>
          <div class="card-author">by ${esc(s.author)} &nbsp;<span class="badge ${s.status}">${s.status}</span></div>
        </div>
        <div class="card-date">${new Date(s.submitted_at).toLocaleDateString()}</div>
      </div>
      <div class="card-desc" style="margin-top:8px">${esc(s.description.slice(0,160))}${s.description.length>160?'…':''}</div>
      ${s.reject_note ? `<div style="color:var(--danger);font-size:0.8em;margin-top:6px">Rejected: ${esc(s.reject_note)}</div>` : ''}
    </div>
  `).join('');
}

async function openModal(id) {
  curId = id;
  document.getElementById('modal-bg').style.display = 'block';
  document.getElementById('modal-name').textContent = 'Loading...';
  document.getElementById('modal-code').textContent = '';
  document.getElementById('modal-desc').textContent = '';
  document.getElementById('modal-meta').textContent = '';
  document.getElementById('action-msg').textContent = '';
  document.getElementById('reject-row').style.display = 'none';

  const res  = await fetch('/api/admin/scripts/' + id, { headers: { 'Authorization': 'Bearer ' + token }});
  const data = await res.json();

  document.getElementById('modal-name').textContent = data.name;
  document.getElementById('modal-meta').textContent =
    'by ' + data.author + '  •  submitted ' + new Date(data.submitted_at).toLocaleString() +
    (data.reviewed_at ? '  •  reviewed ' + new Date(data.reviewed_at).toLocaleString() : '');
  document.getElementById('modal-desc').textContent  = data.description;
  document.getElementById('modal-code').textContent  = data.code;
  document.getElementById('modal-status-row').innerHTML =
    'Status: <span class="badge ' + data.status + '">' + data.status + '</span>' +
    (data.reject_note ? '  Reason: ' + esc(data.reject_note) : '');

  // Hide approve/reject if already decided
  const actions = document.getElementById('modal-actions');
  actions.style.display = data.status === 'pending' ? 'flex' : 'none';
}

function closeModal() {
  document.getElementById('modal-bg').style.display = 'none';
  curId = null;
}

function showReject() {
  const row = document.getElementById('reject-row');
  row.style.display = row.style.display === 'none' ? 'flex' : 'none';
}

async function approve() {
  if (!curId) return;
  const res  = await fetch('/api/admin/approve/' + curId, {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + token }
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('action-msg').textContent = '✓ Approved';
    document.getElementById('modal-actions').style.display = 'none';
    document.getElementById('modal-status-row').innerHTML = 'Status: <span class="badge approved">approved</span>';
    loadTab(curTab);
  }
}

async function reject() {
  if (!curId) return;
  const note = document.getElementById('reject-note').value.trim();
  const res  = await fetch('/api/admin/reject/' + curId, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ note })
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('action-msg').textContent = '✗ Rejected';
    document.getElementById('modal-actions').style.display = 'none';
    document.getElementById('modal-status-row').innerHTML =
      'Status: <span class="badge rejected">rejected</span>' + (note ? '  Reason: ' + esc(note) : '');
    loadTab(curTab);
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Auto-login if token is saved
if (token) login();
</script>
</body>
</html>
