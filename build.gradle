plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
	// A local PaneLib build (its build/maven directory) takes precedence while developing against unreleased PaneLib.
	if (providers.gradleProperty('panelibRepo').isPresent()) {
		maven {
			url = uri(providers.gradleProperty('panelibRepo').get())
			content { includeModule('dev.pane', 'panelib') }
		}
	}
	maven {
		url = uri('https://sl0oth.github.io/PaneLib/maven/')
		content { includeModule('dev.pane', 'panelib') }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"peripheral" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath = file("src/main/resources/peripheral.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// PaneLib draws every Peripheral screen. Players install it separately; fabric.mod.json requires it.
	implementation "dev.pane:panelib:${providers.gradleProperty('panelibVersion').getOrElse(project.panelib_version)}"

	// Mod Menu — optional; compile-only so the mod works without it installed
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Opt-in real-client acceptance harness; never included in a normal build/release.
if (providers.gradleProperty('pilotTest').isPresent()) {
    sourceSets.client.java.srcDir('src/auditClient/java')
    loom.runs.client {
        runDir 'run-pilot-audit'
        vmArg '-Dperipheral.pilotTest=true'
    }
    // A plain dedicated server with no Peripheral Testing, for checking the packet tools stay off.
    loom.runs.server {
        runDir 'run-server'
    }
}

// Opt-in: start the real game the way players install it, with the release jar, PaneLib and Fabric API
// as separate files in a mods folder. tools/install_check.py drives it. -PprodNoPanelib leaves PaneLib out.
if (providers.gradleProperty('prodTest').isPresent()) {
    configurations { prodMods { transitive = false } }
    dependencies {
        prodMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        if (!providers.gradleProperty('prodNoPanelib').isPresent()) {
            prodMods "dev.pane:panelib:${providers.gradleProperty('panelibVersion').getOrElse(project.panelib_version)}"
        }
    }
    tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
        mods.from(tasks.named('jar'))
        mods.from(configurations.prodMods)
        runDir = file('run-prod')
        useXVFB = providers.gradleProperty('prodXvfb').isPresent()
    }
}

processClientResources { exclude "**/__pycache__/**" }
